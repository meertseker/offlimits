name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node --test
      - name: Self-test
        run: node hooks/selftest.mjs --all

  validate:
    runs-on: ubuntu-24.04
    # Informational until we confirm `claude plugin validate` works
    # unauthenticated in CI. If it needs auth, drop this job (see DECISIONS.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code@2.1.310
      - run: claude plugin validate .
